name: Athena iOS build

# Started by Athena from the server (`ios-ci`) when the MacBook is not available.
# Builds for the iOS Simulator, runs tests (optional), launches the app and
# captures a screenshot. Logs + screenshot are uploaded as the artifact "athena-ios".
on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme (empty = first scheme)"
        required: false
        default: ""
      run_tests:
        description: "Run unit tests"
        required: false
        default: "false"
      launch_wait:
        description: "Seconds to wait after launch before the screenshot"
        required: false
        default: "10"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate project and scheme
        id: loc
        run: |
          WS=$(find . -maxdepth 2 -name "*.xcworkspace" -not -path "*/.swiftpm/*" -not -path "*.xcodeproj/*" | head -1)
          PJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          if [ -n "$WS" ]; then echo "flag=-workspace" >> $GITHUB_OUTPUT; echo "path=$WS" >> $GITHUB_OUTPUT; C="-workspace"; P="$WS";
          else echo "flag=-project" >> $GITHUB_OUTPUT; echo "path=$PJ" >> $GITHUB_OUTPUT; C="-project"; P="$PJ"; fi
          S="${{ github.event.inputs.scheme }}"
          if [ -z "$S" ]; then S=$(xcodebuild $C "$P" -list -json | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('project') or d.get('workspace'))['schemes'][0])"); fi
          echo "scheme=$S" >> $GITHUB_OUTPUT
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(c[-1]['udid'])")
          echo "sim=$SIM" >> $GITHUB_OUTPUT
          mkdir -p out; echo "project=$P scheme=$S sim=$SIM" | tee out/summary.txt

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build ${{ steps.loc.outputs.flag }} "${{ steps.loc.outputs.path }}" -scheme "${{ steps.loc.outputs.scheme }}" \
            -destination "id=${{ steps.loc.outputs.sim }}" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/build.log | grep -E "error:|warning:|\*\* BUILD" | tail -80
          grep -E "error:" out/build.log | sort -u > out/errors.txt || true

      - name: Test
        if: ${{ github.event.inputs.run_tests == 'true' }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test ${{ steps.loc.outputs.flag }} "${{ steps.loc.outputs.path }}" -scheme "${{ steps.loc.outputs.scheme }}" \
            -destination "id=${{ steps.loc.outputs.sim }}" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/test.log | grep -E "Test Case .* (passed|failed)|error:|\*\* TEST" | tail -80

      - name: Launch and screenshot
        continue-on-error: true
        run: |
          APP=$(find dd/Build/Products -maxdepth 2 -name "*.app" -path "*iphonesimulator*" | head -1)
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "${{ steps.loc.outputs.sim }}" || true
          xcrun simctl bootstatus "${{ steps.loc.outputs.sim }}" -b
          xcrun simctl install "${{ steps.loc.outputs.sim }}" "$APP"
          xcrun simctl launch "${{ steps.loc.outputs.sim }}" "$BID" | tee -a out/summary.txt
          sleep "${{ github.event.inputs.launch_wait }}"
          xcrun simctl io "${{ steps.loc.outputs.sim }}" screenshot out/screenshot.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athena-ios
          path: out/
          retention-days: 7
